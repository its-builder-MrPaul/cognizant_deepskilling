<div
  class="course-card"
  appHighlight="pink"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left':
      course.gradeStatus === 'passed'
        ? '6px solid green'
        : course.gradeStatus === 'failed'
        ? '6px solid red'
        : '6px solid gray'
  }"
>

  <h3>{{ course.name }}</h3>

  <p>Code : {{ course.code }}</p>

  <p>Credits : {{ course.credits|creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">

    <p *ngSwitchCase="'passed'">
      🟢 Passed
    </p>

    <p *ngSwitchCase="'failed'">
      🔴 Failed
    </p>

    <p *ngSwitchCase="'pending'">
      ⚪ Pending
    </p>

    <p *ngSwitchDefault>
      Unknown
    </p>

  </div>

  <button (click)="enroll()">
    Enroll
  </button>

  <button (click)="toogleDetail()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <div *ngIf="isExpanded">

    <p><strong>Instructor:</strong> John Doe</p>

    <p><strong>Duration:</strong> 12 Weeks</p>

    <p>This course covers all fundamentals.</p>

  </div>

</div>
